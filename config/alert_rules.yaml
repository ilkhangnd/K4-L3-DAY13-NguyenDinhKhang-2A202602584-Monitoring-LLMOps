alerts:
  - name: latency_slo_breach
    severity: warning
    condition: 'latency_p95_ms > 3000'
    duration: 10m
    type: symptom-based
    channel: '#day13-llmops-alerts'
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-1-latency-slo-breach
  - name: elevated_request_failures
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 5m
    type: symptom-based
    channel: '#day13-llmops-alerts'
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-2-elevated-request-failures
  - name: degraded_retrieval_success
    severity: warning
    condition: 'retrieval_success_rate_pct < 90'
    duration: 10m
    type: symptom-based
    channel: '#day13-llmops-alerts'
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-3-degraded-retrieval-success
